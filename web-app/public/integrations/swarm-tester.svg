<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1446"/>
      <stop offset="0.55" stop-color="#2a1260"/>
      <stop offset="1" stop-color="#0c0a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff7a3d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff7a3d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <circle cx="512" cy="512" r="400" fill="url(#glow)"/>
    <!-- honeycomb grid, faint -->
    <g fill="none" stroke="#8b7bff" stroke-opacity="0.10" stroke-width="3">
      <path id="h" d="M0,-46 L40,-23 L40,23 L0,46 L-40,23 L-40,-23 Z"/>
    </g>
    <g fill="none" stroke="#a99bff" stroke-opacity="0.09" stroke-width="3">
      <use href="#h" x="232" y="232"/><use href="#h" x="312" y="232"/><use href="#h" x="712" y="232"/><use href="#h" x="792" y="232"/>
      <use href="#h" x="192" y="301"/><use href="#h" x="832" y="301"/>
      <use href="#h" x="232" y="370"/><use href="#h" x="792" y="370"/>
      <use href="#h" x="232" y="654"/><use href="#h" x="792" y="654"/>
      <use href="#h" x="192" y="723"/><use href="#h" x="832" y="723"/>
      <use href="#h" x="232" y="792"/><use href="#h" x="312" y="792"/><use href="#h" x="712" y="792"/><use href="#h" x="792" y="792"/>
    </g>
    <!-- swarm trails converging on target -->
    <g stroke-linecap="round" fill="none">
      <path d="M210 250 Q 340 330 455 455" stroke="#9d8cff" stroke-opacity="0.45" stroke-width="5"/>
      <path d="M830 220 Q 700 360 570 460" stroke="#9d8cff" stroke-opacity="0.40" stroke-width="5"/>
      <path d="M860 760 Q 700 690 575 575" stroke="#9d8cff" stroke-opacity="0.40" stroke-width="5"/>
      <path d="M180 700 Q 330 640 452 572" stroke="#9d8cff" stroke-opacity="0.45" stroke-width="5"/>
      <path d="M512 150 Q 540 300 515 430" stroke="#9d8cff" stroke-opacity="0.35" stroke-width="4"/>
      <path d="M512 880 Q 480 720 508 596" stroke="#9d8cff" stroke-opacity="0.35" stroke-width="4"/>
    </g>
    <!-- target -->
    <circle cx="512" cy="512" r="178" fill="none" stroke="url(#ring)" stroke-width="22" stroke-opacity="0.95"/>
    <circle cx="512" cy="512" r="112" fill="none" stroke="url(#ring)" stroke-width="14" stroke-opacity="0.8"/>
    <g stroke="#ffa24d" stroke-width="14" stroke-linecap="round">
      <line x1="512" y1="300" x2="512" y2="360"/><line x1="512" y1="664" x2="512" y2="724"/>
      <line x1="300" y1="512" x2="360" y2="512"/><line x1="664" y1="512" x2="724" y2="512"/>
    </g>
    <circle cx="512" cy="512" r="30" fill="#fff1d0" filter="url(#soft)"/>
    <circle cx="512" cy="512" r="22" fill="#fff6e2"/>
    <!-- swarm agents -->
    <g fill="#e9e4ff">
      <circle cx="455" cy="455" r="15"/><circle cx="570" cy="460" r="13"/><circle cx="575" cy="575" r="14"/>
      <circle cx="452" cy="572" r="13"/><circle cx="515" cy="430" r="10"/><circle cx="508" cy="596" r="10"/>
      <circle cx="340" cy="332" r="11" fill-opacity="0.8"/><circle cx="700" cy="355" r="11" fill-opacity="0.8"/>
      <circle cx="705" cy="690" r="11" fill-opacity="0.8"/><circle cx="325" cy="640" r="11" fill-opacity="0.8"/>
      <circle cx="232" cy="262" r="8" fill-opacity="0.55"/><circle cx="812" cy="238" r="8" fill-opacity="0.55"/>
      <circle cx="838" cy="750" r="8" fill-opacity="0.55"/><circle cx="200" cy="692" r="8" fill-opacity="0.55"/>
      <circle cx="530" cy="220" r="7" fill-opacity="0.5"/><circle cx="492" cy="820" r="7" fill-opacity="0.5"/>
    </g>
    <rect x="100" y="100" width="824" height="420" fill="url(#sheen)"/>
  </g>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
</svg>
